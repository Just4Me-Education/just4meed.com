name: Security check

on:
  pull_request:
  push:
  schedule:
    - cron: "17 13 * * 1"   # Mondays, ~8am New York
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-check:
    name: security-check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check pages follow the security policy
        run: python3 -I .github/scripts/check_site.py

  live:
    name: live-site
    needs: security-check
    # After a push to the branch the site is built from, on the weekly schedule, or when run by hand.
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref_name == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Wait for GitHub Pages to publish
        if: github.event_name == 'push'
        run: sleep 120
      - name: Check the live site
        run: python3 -I .github/scripts/check_site.py --live
